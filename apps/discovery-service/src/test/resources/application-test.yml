spring:
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false

  datasource:
    url: jdbc:h2:mem:discovery_service_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  rabbitmq:
    host: localhost
    port: 5672

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081

server:
  port: 0

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.campusfruit: DEBUG
    org.springframework.web: WARN

app:
  discovery:
    events:
      exchange: campus-fruit.test.events

discovery:
  merchant-service:
    url: http://localhost:8086
  offer-service:
    url: http://localhost:8086
  internal-api-key: test-internal-key
