spring:
  application:
    name: discovery-service
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  messages:
    encoding: UTF-8

  datasource:
    url: jdbc:mysql://localhost:3306/discovery_service
    username: root
    password: ${DB_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081}

server:
  port: 8086

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: discovery-service
  tracing:
    sampling:
      probability: 1.0

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    com.campusfruit: DEBUG
    org.springframework.web: INFO

app:
  discovery:
    events:
      exchange: campus-fruit.events
  ranking:
    weights:
      relevance: 0.30
      price: 0.25
      distance: 0.20
      rating: 0.15
      fulfillment: 0.10
    cold-start:
      max-exploration-slots: 1
      min-review-count: 10
      min-opening-days: 30
      exploration-bonus: 0.15
      min-rating-threshold: 2.0
      low-rating-min-review-count: 5
    bayesian:
      prior-mean: 3.5
      prior-weight: 10

discovery:
  merchant-service:
    url: ${MERCHANT_SERVICE_URL:http://merchant-service}
  offer-service:
    url: ${OFFER_SERVICE_URL:http://offer-service}
  order-service:
    url: ${ORDER_SERVICE_URL:http://order-service}
  internal-api-key: ${INTERNAL_API_KEY:internal-discovery-key-2024}
