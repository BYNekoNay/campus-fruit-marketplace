spring:
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false

  datasource:
    url: jdbc:mysql://localhost:3306/order_service_test
    username: test
    password: test
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        auto-startup: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081

server:
  port: 0

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.campusfruit: DEBUG
    org.springframework.web: WARN
    org.springframework.security: WARN

app:
  internal:
    api-key: test-internal-api-key
  order:
    events:
      exchange: campus-fruit.events.test
    offer-service:
      url: http://localhost:18083
