spring:
  application:
    name: order-service
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  messages:
    encoding: UTF-8

  datasource:
    url: jdbc:mysql://localhost:3306/order_service
    username: root
    password: ${DB_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081}

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: order-service
  tracing:
    sampling:
      probability: 1.0

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    com.campusfruit: DEBUG
    org.springframework.web: INFO

app:
  internal:
    api-key: ${INTERNAL_API_KEY:internal-api-key-change-me}
  order:
    events:
      exchange: campus-fruit.events
    offer-service:
      url: ${OFFER_SERVICE_URL:http://localhost:8083}
    saga:
      reservation-timeout: 10s
    reconciliation:
      enabled: true
      pending-reservation-max-minutes: 5
      store-confirmation-timeout-minutes: 15
      no-show-grace-minutes: 30
    pickup:
      code-length: 6
      code-expiry-hours: 24
    services:
      offer:
        url: http://localhost:8083
        internal-api-key: ${INTERNAL_API_KEY:dev-internal-key}
