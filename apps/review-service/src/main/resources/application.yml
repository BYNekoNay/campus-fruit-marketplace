spring:
  application:
    name: review-service
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  messages:
    encoding: UTF-8

  datasource:
    url: jdbc:mysql://localhost:3306/review_service
    username: root
    password: ${DB_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081}

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: review-service
  tracing:
    sampling:
      probability: 1.0

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    com.campusfruit: DEBUG
    org.springframework.web: INFO

app:
  review:
    bayesian:
      global-avg-c: 3.5
      min-votes-m: 5
    risk:
      suspicious-window-minutes: 10
      suspicious-max-reviews: 5
      min-review-time-seconds: 30
      duplicate-similarity-threshold: 0.8
      spike-window-minutes: 60
      spike-threshold: 10
