spring:
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false

  datasource:
    url: jdbc:tc:mysql:8.0://localhost:3306/review_service_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  rabbitmq:
    listener:
      simple:
        auto-startup: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000/realms/test

server:
  port: 0

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.campusfruit: DEBUG
    org.springframework.web: WARN
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
