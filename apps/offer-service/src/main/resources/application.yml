spring:
  application:
    name: offer-service
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  messages:
    encoding: UTF-8

  datasource:
    url: jdbc:mysql://localhost:3306/offer_service
    username: root
    password: ${DB_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: offer-service
  tracing:
    sampling:
      probability: 1.0

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    com.campusfruit: DEBUG
    org.springframework.web: INFO

app:
  internal:
    api-key: ${INTERNAL_API_KEY:internal-api-key-change-me}
  offer:
    price-freshness:
      warning-hours: 24
      stale-exit-hours: 72
      pause-hours: 168
      enabled: ${PRICE_FRESHNESS_ENABLED:false}
    reservation-expiry:
      enabled: ${RESERVATION_EXPIRY_ENABLED:false}
    events:
      exchange: campus-fruit.events
