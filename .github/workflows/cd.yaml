name: CD Build & Push

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
  NAMESPACE: ${{ vars.ALIYUN_ACR_NAMESPACE }}

jobs:
  build-and-push:
    name: Build & Push
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - image: gateway
            application: gateway-service
            dockerfile: Dockerfile
          - image: identity
            application: identity-service
            dockerfile: Dockerfile
          - image: merchant
            application: merchant-service
            dockerfile: Dockerfile
          - image: offer
            application: offer-service
            dockerfile: Dockerfile
          - image: order
            application: order-service
            dockerfile: Dockerfile
          - image: review
            application: review-service
            dockerfile: Dockerfile
          - image: discovery
            application: discovery-service
            dockerfile: Dockerfile
          - image: web
            application: web
            dockerfile: Dockerfile.web

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Build & Push ${{ matrix.image }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/campus-fruit-${{ matrix.image }}"
          docker build \
            -f ${{ matrix.dockerfile }} \
            --build-arg SERVICE=${{ matrix.application }} \
            -t $IMAGE:latest \
            -t $IMAGE:${{ github.event.workflow_run.head_sha || github.sha }} \
            .
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.event.workflow_run.head_sha || github.sha }}
