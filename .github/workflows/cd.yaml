name: CD Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9
        with:
          ssh-private-key: ${{ secrets.ECS_SSH_KEY }}

      - name: Sync code to ECS
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='target/' \
            --exclude='node_modules/' \
            --exclude='web/dist/' \
            --exclude='.idea/' \
            ./ ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:/opt/campus-fruit-marketplace/

      - name: Deploy on ECS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT }}
          script_stop: true
          script: |
            set -e
            cd /opt/campus-fruit-marketplace

            echo "=== Starting infrastructure ==="
            docker compose -f deploy/compose/compose.core.yaml --profile core up -d --wait

            echo "=== Building & starting services ==="
            docker compose -f deploy/compose/compose.yaml --profile marketplace up -d --build

            echo "=== Checking health ==="
            sleep 30
            docker compose -f deploy/compose/compose.yaml --profile marketplace ps

            echo "=== Cleaning old images ==="
            docker image prune -af --filter "until=24h"
