name: CD Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/bynekonay/campus-fruit

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [gateway, identity, merchant, offer, order, review, discovery]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push ${{ matrix.service }}
        run: |
          IMAGE="${{ env.IMAGE_PREFIX }}/${{ matrix.service }}"
          docker build \
            --build-arg SERVICE=${{ matrix.service }}-service \
            -t $IMAGE:latest \
            -t $IMAGE:${{ github.sha }} \
            .
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}

  deploy:
    name: Deploy to ECS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on ECS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT }}
          timeout: 10m
          script: |
            set -e
            cd /opt/campus-fruit-marketplace

            echo "=== Login to GitHub Container Registry ==="
            echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "=== Pull latest images ==="
            docker compose -f deploy/compose/compose.core.yaml -f deploy/compose/compose.yaml --profile all pull

            echo "=== Start all services ==="
            docker compose -f deploy/compose/compose.core.yaml -f deploy/compose/compose.yaml --profile all up -d --wait

            echo "=== Status ==="
            docker compose -f deploy/compose/compose.core.yaml -f deploy/compose/compose.yaml --profile all ps

            echo "=== Cleanup ==="
            docker image prune -af --filter "until=48h"
