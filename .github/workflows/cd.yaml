name: CD Build & Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [gateway, identity, merchant, offer, order, review, discovery]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ECS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.ECS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Build image
        run: |
          SERVICE=${{ matrix.service }}
          docker build --build-arg SERVICE=${SERVICE}-service \
            -t campus-fruit/${SERVICE}:latest .

      - name: Save & Transfer to Server
        run: |
          SERVICE=${{ matrix.service }}
          docker save campus-fruit/${SERVICE}:latest | gzip | \
            ssh -i ~/.ssh/deploy_key ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }} \
            "gunzip | docker load && docker tag campus-fruit/${SERVICE}:latest ghcr.io/bynekonay/campus-fruit/${SERVICE}:latest"

      - name: Push to ghcr.io (backup)
        run: |
          SERVICE=${{ matrix.service }}
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag campus-fruit/${SERVICE}:latest ghcr.io/bynekonay/campus-fruit/${SERVICE}:latest
          docker push ghcr.io/bynekonay/campus-fruit/${SERVICE}:latest
        continue-on-error: true

  deploy:
    name: Start Services
    needs: build-and-deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync compose files
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ECS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.ECS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            deploy/compose/ \
            ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:/opt/campus-fruit-marketplace/deploy/compose/

      - name: Start on Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT }}
          timeout: 10m
          script: |
            set -e
            cd /opt/campus-fruit-marketplace
            docker compose -f deploy/compose/compose.core.yaml -f deploy/compose/compose.yaml --profile all up -d --wait
            docker compose -f deploy/compose/compose.core.yaml -f deploy/compose/compose.yaml --profile all ps
            docker image prune -af --filter "until=48h" || true
