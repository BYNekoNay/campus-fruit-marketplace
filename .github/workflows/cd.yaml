name: CD Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ECS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.ECS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync code to ECS
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            --exclude='.git' \
            --exclude='target/' \
            --exclude='node_modules/' \
            --exclude='web/dist/' \
            --exclude='.idea/' \
            ./ ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:/opt/campus-fruit-marketplace/

      - name: Deploy on ECS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT }}
          script_stop: true
          script: |
            set -e
            cd /opt/campus-fruit-marketplace

            echo "=== Starting infrastructure ==="
            docker compose -f deploy/compose/compose.core.yaml --profile core up -d --wait

            echo "=== Starting all services ==="
            docker compose -f deploy/compose/compose.core.yaml -f deploy/compose/compose.yaml --profile all up -d --build

            echo "=== Checking health ==="
            sleep 30
            docker compose -f deploy/compose/compose.core.yaml -f deploy/compose/compose.yaml --profile all ps

            echo "=== Cleaning old images ==="
            docker image prune -af --filter "until=24h"
