name: CD Build & Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/bynekonay/campus-fruit

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [gateway, identity, merchant, offer, order, review, discovery]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push ${{ matrix.service }}
        run: |
          IMAGE="${{ env.IMAGE_PREFIX }}/${{ matrix.service }}"
          docker build \
            --build-arg SERVICE=${{ matrix.service }}-service \
            -t $IMAGE:latest \
            .
          docker push $IMAGE:latest

  deploy:
    name: Deploy
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync to Server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ECS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.ECS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            deploy/compose/ \
            ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:/opt/campus-fruit-marketplace/deploy/compose/

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT }}
          timeout: 15m
          script: |
            set -e
            cd /opt/campus-fruit-marketplace

            echo "=== Login to ghcr.io ==="
            echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "=== Pull & Start ==="
            docker compose -f deploy/compose/compose.core.yaml -f deploy/compose/compose.yaml --profile all pull
            docker compose -f deploy/compose/compose.core.yaml -f deploy/compose/compose.yaml --profile all up -d --wait

            echo "=== Status ==="
            docker compose -f deploy/compose/compose.core.yaml -f deploy/compose/compose.yaml --profile all ps

            echo "=== Cleanup ==="
            docker image prune -af --filter "until=48h"
