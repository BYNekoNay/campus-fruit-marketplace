name: CD Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & Push all services
        run: |
          ACR="${{ secrets.ACR_REGISTRY }}/campus-fruit"
          for svc in gateway identity merchant offer order review discovery; do
            echo "=== Building $svc ==="
            docker build \
              --build-arg SERVICE=${svc}-service \
              -t $ACR/${svc}:latest \
              -t $ACR/${svc}:${{ github.sha }} \
              .
            docker push $ACR/${svc}:latest
            docker push $ACR/${svc}:${{ github.sha }}
          done

  deploy:
    name: Deploy to ECS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on ECS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT }}
          timeout: 10m
          script: |
            set -e
            cd /opt/campus-fruit-marketplace
            git pull origin master 2>/dev/null || true

            echo "=== Pull latest images ==="
            docker compose -f deploy/compose/compose.core.yaml -f deploy/compose/compose.yaml --profile all pull

            echo "=== Start all services ==="
            docker compose -f deploy/compose/compose.core.yaml -f deploy/compose/compose.yaml --profile all up -d --wait

            echo "=== Status ==="
            docker compose -f deploy/compose/compose.core.yaml -f deploy/compose/compose.yaml --profile all ps

            echo "=== Cleanup ==="
            docker image prune -af --filter "until=48h"
