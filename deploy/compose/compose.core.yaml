services:
  mysql:
    image: mysql:8.4
    container_name: campus-mysql
    profiles:
      - core
      - all
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      MYSQL_CHARACTER_SET: utf8mb4
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - campus-fruit-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7.4-alpine
    container_name: campus-redis
    profiles:
      - core
      - all
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - campus-fruit-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 96M

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    container_name: campus-rabbitmq
    profiles:
      - core
      - all
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    networks:
      - campus-fruit-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 192M

  nacos:
    image: nacos/nacos-server:v2.4.0
    container_name: campus-nacos
    profiles:
      - core
      - all
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: derby
      JVM_XMS: 64m
      JVM_XMX: 192m
      JVM_XMN: 32m
    ports:
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - campus-fruit-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  campus-fruit-net:
    name: campus-fruit-net
    driver: bridge

volumes:
  mysql-data:
    name: campus-mysql-data
