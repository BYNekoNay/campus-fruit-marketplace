# ============================================
# 校园水果商城 — 全部服务启动
# 使用方式:
#   1. 先启基础设施: docker compose -f compose.core.yaml --profile core up -d
#   2. 再启微服务:   docker compose -f compose.yaml --profile marketplace up -d
#   3. 一键全部:     docker compose -f compose.core.yaml -f compose.yaml --profile all up -d
# 镜像由 GitHub Actions 构建并推送到 ACR，ECS 只负责拉取
# ============================================

services:
  # ---- 基础设施（引用 core compose） ----
  mysql:
    extends:
      file: compose.core.yaml
      service: mysql

  redis:
    extends:
      file: compose.core.yaml
      service: redis

  rabbitmq:
    extends:
      file: compose.core.yaml
      service: rabbitmq

  nacos:
    extends:
      file: compose.core.yaml
      service: nacos

  # ---- 网关 ----
  gateway:
    profiles: ["marketplace", "all"]
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY must be set}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE must be set}/campus-fruit-gateway:${IMAGE_TAG:-latest}
    container_name: campus-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m"
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER_ADDR: nacos:8848
    depends_on:
      nacos:
        condition: service_healthy
    networks:
      - campus-fruit-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ---- 身份服务 ----
  identity:
    profiles: ["marketplace", "all"]
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY must be set}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE must be set}/campus-fruit-identity:${IMAGE_TAG:-latest}
    container_name: campus-identity
    ports:
      - "${IDENTITY_PORT:-8081}:8081"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m"
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER_ADDR: nacos:8848
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      JWT_ISSUER_URI: http://identity:8081
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - campus-fruit-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ---- 商家服务 ----
  merchant:
    profiles: ["marketplace", "all"]
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY must be set}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE must be set}/campus-fruit-merchant:${IMAGE_TAG:-latest}
    container_name: campus-merchant
    ports:
      - "${MERCHANT_PORT:-8082}:8082"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m"
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER_ADDR: nacos:8848
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      JWT_ISSUER_URI: http://identity:8081
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
      BAIDU_SERVER_AK: ${BAIDU_SERVER_AK:-}
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - campus-fruit-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ---- 报价服务 ----
  offer:
    profiles: ["marketplace", "all"]
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY must be set}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE must be set}/campus-fruit-offer:${IMAGE_TAG:-latest}
    container_name: campus-offer
    ports:
      - "${OFFER_PORT:-8083}:8083"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m"
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER_ADDR: nacos:8848
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      JWT_ISSUER_URI: http://identity:8081
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - campus-fruit-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ---- 订单服务 ----
  order:
    profiles: ["marketplace", "all"]
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY must be set}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE must be set}/campus-fruit-order:${IMAGE_TAG:-latest}
    container_name: campus-order
    ports:
      - "${ORDER_PORT:-8084}:8084"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m"
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER_ADDR: nacos:8848
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      JWT_ISSUER_URI: http://identity:8081
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - campus-fruit-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ---- 评价服务 ----
  review:
    profiles: ["marketplace", "all"]
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY must be set}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE must be set}/campus-fruit-review:${IMAGE_TAG:-latest}
    container_name: campus-review
    ports:
      - "${REVIEW_PORT:-8085}:8085"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m"
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER_ADDR: nacos:8848
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      JWT_ISSUER_URI: http://identity:8081
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - campus-fruit-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ---- 发现服务 ----
  discovery:
    profiles: ["marketplace", "all"]
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY must be set}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE must be set}/campus-fruit-discovery:${IMAGE_TAG:-latest}
    container_name: campus-discovery
    ports:
      - "${DISCOVERY_PORT:-8086}:8086"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m"
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER_ADDR: nacos:8848
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - campus-fruit-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ---- 前端 Nginx ----
  web:
    profiles: ["marketplace", "all"]
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY must be set}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE must be set}/campus-fruit-web:${IMAGE_TAG:-latest}
    container_name: campus-web
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - campus-fruit-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  campus-fruit-net:
    name: campus-fruit-net
    driver: bridge
