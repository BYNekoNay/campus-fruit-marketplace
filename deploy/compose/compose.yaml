version: "3.8"

# ============================================
# 校园水果商城 — 全部服务启动
# 使用方式:
#   1. 先启基础设施: docker compose -f compose.core.yaml --profile core up -d
#   2. 再启微服务:   docker compose -f compose.yaml --profile marketplace up -d --build
#   3. 一键全部:     docker compose -f compose.core.yaml -f compose.yaml --profile all up -d --build
# ============================================

services:
  # ---- 基础设施（引用 core compose） ----
  mysql:
    extends:
      file: compose.core.yaml
      service: mysql

  redis:
    extends:
      file: compose.core.yaml
      service: redis

  rabbitmq:
    extends:
      file: compose.core.yaml
      service: rabbitmq

  nacos:
    extends:
      file: compose.core.yaml
      service: nacos

  # ---- 网关 ----
  gateway:
    profiles: ["marketplace", "all"]
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: gateway-service
    image: campus-fruit/gateway:latest
    container_name: campus-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m"
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER_ADDR: nacos:8848
    depends_on:
      nacos:
        condition: service_healthy
    networks:
      - campus-fruit-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ---- 身份服务 ----
  identity:
    profiles: ["marketplace", "all"]
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: identity-service
    image: campus-fruit/identity:latest
    container_name: campus-identity
    ports:
      - "${IDENTITY_PORT:-8081}:8081"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m"
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER_ADDR: nacos:8848
      DB_PASSWORD: ${DB_PASSWORD:-root123}
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - campus-fruit-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ---- 商家服务 ----
  merchant:
    profiles: ["marketplace", "all"]
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: merchant-service
    image: campus-fruit/merchant:latest
    container_name: campus-merchant
    ports:
      - "${MERCHANT_PORT:-8082}:8082"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m"
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER_ADDR: nacos:8848
      DB_PASSWORD: ${DB_PASSWORD:-root123}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      BAIDU_SERVER_AK: ${BAIDU_SERVER_AK:-}
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - campus-fruit-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ---- 报价服务 ----
  offer:
    profiles: ["marketplace", "all"]
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: offer-service
    image: campus-fruit/offer:latest
    container_name: campus-offer
    ports:
      - "${OFFER_PORT:-8083}:8083"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m"
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER_ADDR: nacos:8848
      DB_PASSWORD: ${DB_PASSWORD:-root123}
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - campus-fruit-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ---- 订单服务 ----
  order:
    profiles: ["marketplace", "all"]
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: order-service
    image: campus-fruit/order:latest
    container_name: campus-order
    ports:
      - "${ORDER_PORT:-8084}:8084"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m"
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER_ADDR: nacos:8848
      DB_PASSWORD: ${DB_PASSWORD:-root123}
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - campus-fruit-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ---- 评价服务 ----
  review:
    profiles: ["marketplace", "all"]
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: review-service
    image: campus-fruit/review:latest
    container_name: campus-review
    ports:
      - "${REVIEW_PORT:-8085}:8085"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m"
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER_ADDR: nacos:8848
      DB_PASSWORD: ${DB_PASSWORD:-root123}
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - campus-fruit-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ---- 发现服务 ----
  discovery:
    profiles: ["marketplace", "all"]
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: discovery-service
    image: campus-fruit/discovery:latest
    container_name: campus-discovery
    ports:
      - "${DISCOVERY_PORT:-8086}:8086"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m"
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER_ADDR: nacos:8848
      DB_PASSWORD: ${DB_PASSWORD:-root123}
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - campus-fruit-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ---- 前端 Nginx ----
  web:
    profiles: ["marketplace", "all"]
    image: nginx:1.27-alpine
    container_name: campus-web
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ../../web/dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - campus-fruit-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  campus-fruit-net:
    name: campus-fruit-net
    external: true
