global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "campus-fruit-gateway"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["gateway:8080"]
        labels:
          application: "gateway"
  - job_name: "campus-fruit-identity"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["identity:8081"]
        labels:
          application: "identity"
  - job_name: "campus-fruit-merchant"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["merchant:8082"]
        labels:
          application: "merchant"
  - job_name: "campus-fruit-offer"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["offer:8083"]
        labels:
          application: "offer"
  - job_name: "campus-fruit-order"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["order:8084"]
        labels:
          application: "order"
  - job_name: "campus-fruit-review"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["review:8085"]
        labels:
          application: "review"
  - job_name: "campus-fruit-discovery"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["discovery:8086"]
        labels:
          application: "discovery"
